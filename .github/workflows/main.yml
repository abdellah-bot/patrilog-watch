name: patrilog-watch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patrilog-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Patrilog
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python "patrilog_watch (1).py" --once

      - name: Save state
        run: |
          git config user.name "patrilog-watcher"
          git config user.email "watcher@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "state update" && git push)
